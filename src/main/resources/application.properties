spring.application.name=demo
# Porta del server
server.port=8080

# Database H2 su file con AUTO_SERVER: l'app apre il DB in modalità embedded e
# apre automaticamente un server locale, così anche DBeaver può collegarsi allo
# stesso database mentre l'app è in esecuzione.
spring.datasource.url=jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Abilitazione console H2 (accessibile tramite browser per visualizzare i dati)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurazione JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true